    <!-- Google Analytics (GA4). send_page_view is off because this is an SPA
         (BrowserRouter) — a client-side route change never re-runs this script,
         so the automatic pageview would only ever fire once for the whole
         session. src/components/Analytics.tsx fires page_view manually on
         every route change instead (including the first). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KRYQC7D1SB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-KRYQC7D1SB", { send_page_view: false });
    </script>

    <!-- Open Graph / social preview. Defaults live here as a fallback for
         crawlers and the site root; per-page overrides are injected at runtime
         via react-helmet-async (and baked into static HTML by the prerender
         step in scripts/prerender.mjs). Keep these in sync with the Layout
         default Helmet. Crawlers require ABSOLUTE URLs. -->

    <meta property="og:site_name" content="Antaria Lore" />
